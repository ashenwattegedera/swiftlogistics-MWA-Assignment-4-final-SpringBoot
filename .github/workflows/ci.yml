name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build & unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: mvn -B clean install

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.{txt,xml}"
          retention-days: 14

  smoke-test:
    name: End-to-end smoke test (real CMS/ROS/WMS)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package jars (skip tests)
        run: mvn -B -q -DskipTests package

      - name: Run full-system smoke test
        run: bash scripts/smoke-test.sh

      - name: Upload service logs (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: /tmp/swifttrack-logs/
          retention-days: 7
