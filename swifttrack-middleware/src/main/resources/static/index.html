<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftTrack — Client Portal</title>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f4f6f9; color: #1a2733; }
        header { background: #1b5e8f; color: #fff; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        .wrap { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 20px; margin-bottom: 20px; }
        .card h2 { margin: 0 0 16px; font-size: 16px; color: #1b5e8f; }
        label { display: block; font-size: 12px; color: #556; margin: 10px 0 4px; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cdd5dd; border-radius: 4px; }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }
        button { background: #1b5e8f; color: #fff; border: 0; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #164c73; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e8edf2; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .status-CREATED, .status-CMS_ACCEPTED, .status-WAREHOUSE_RECEIVED { background: #fff3cd; color: #856404; }
        .status-PICKED, .status-PACKED, .status-READY_FOR_DELIVERY { background: #d1ecf1; color: #0c5460; }
        .status-ROUTE_ASSIGNED, .status-OUT_FOR_DELIVERY { background: #cce5ff; color: #004085; }
        .status-DELIVERED { background: #d4edda; color: #155724; }
        .status-FAILED, .status-CANCELLED { background: #f8d7da; color: #721c24; }
        #timeline { list-style: none; padding: 0; }
        #timeline li { padding: 6px 0; border-left: 3px solid #1b5e8f; padding-left: 12px; margin: 6px 0; font-size: 13px; }
        #ack { margin-top: 10px; font-size: 13px; color: #155724; }
    </style>
</head>
<body>
<header><h1>SwiftTrack — Client Portal</h1></header>
<div class="wrap">
    <div class="card">
        <h2>Submit an order</h2>
        <form id="orderForm">
            <div class="row">
                <div><label>Client ID</label><input name="clientId" value="C-100" required></div>
                <div><label>Reference</label><input name="clientReference" value="REF-1001" required></div>
            </div>
            <div class="row">
                <div><label>Recipient name</label><input name="recipientName" value="Anura Silva" required></div>
                <div><label>Recipient phone</label><input name="recipientPhone" value="0771234567" required></div>
            </div>
            <div class="row">
                <div><label>Street</label><input name="street" value="42 Galle Road" required></div>
                <div><label>City</label><input name="city" value="Colombo 03" required></div>
                <div><label>Postal code</label><input name="postalCode" value="00300" required></div>
            </div>
            <div class="row">
                <div><label>Latitude</label><input name="latitude" value="6.9170" type="number" step="any"></div>
                <div><label>Longitude</label><input name="longitude" value="79.8500" type="number" step="any"></div>
            </div>
            <label>Items (comma separated "sku:description:qty")</label>
            <input name="items" value="SKU-1:Ceylon Tea:2, SKU-2:Book:1">
            <br><br>
            <button type="submit">Submit order</button>
        </form>
        <div id="ack"></div>
        <h2 style="margin-top:20px;">Live status</h2>
        <ul id="timeline"></ul>
    </div>

    <div class="card">
        <h2>Orders</h2>
        <table>
            <thead><tr><th>Order</th><th>Client</th><th>Recipient</th><th>Status</th><th>Driver</th></tr></thead>
            <tbody id="orders"></tbody>
        </table>
    </div>
</div>

<script src="stomp.js"></script>
<script>
    var trackedOrderId = null;

    function renderOrders() {
        fetch('/api/orders').then(r => r.json()).then(orders => {
            var tbody = document.getElementById('orders');
            tbody.innerHTML = '';
            orders.forEach(function (o) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + o.orderId + '</td>' +
                    '<td>' + o.clientId + '</td>' +
                    '<td>' + o.recipient.name + '</td>' +
                    '<td><span class="badge status-' + o.status + '">' + o.status + '</span></td>' +
                    '<td>' + (o.driverId || '-') + '</td>';
                tbody.appendChild(tr);
            });
        });
    }

    function appendTimeline(status, message) {
        var li = document.createElement('li');
        li.textContent = '[' + new Date().toLocaleTimeString() + '] ' + status + ' — ' + message;
        document.getElementById('timeline').appendChild(li);
    }

    document.getElementById('orderForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target;
        var itemsRaw = f.items.value.split(',').map(function (s) {
            var p = s.trim().split(':');
            return { sku: p[0], description: p[1], quantity: parseInt(p[2], 10) };
        });
        var payload = {
            clientId: f.clientId.value,
            clientReference: f.clientReference.value,
            recipient: { name: f.recipientName.value, phone: f.recipientPhone.value },
            address: {
                street: f.street.value, city: f.city.value, postalCode: f.postalCode.value,
                latitude: parseFloat(f.latitude.value), longitude: parseFloat(f.longitude.value)
            },
            items: itemsRaw
        };
        fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(r => r.json()).then(function (resp) {
            trackedOrderId = resp.orderId;
            document.getElementById('ack').textContent =
                'Order accepted: ' + resp.orderId + ' (status ' + resp.status + ') — tracking live…';
            document.getElementById('timeline').innerHTML = '';
            appendTimeline(resp.status, 'order submitted');
            if (client.connected) { subscribeToOrder(trackedOrderId); }
        });
    });

    var client = new StompClient('ws://' + location.host + '/ws');
    var subscribedOrder = null;

    function subscribeToOrder(orderId) {
        if (subscribedOrder === orderId) { return; }
        subscribedOrder = orderId;
        client.subscribe('/topic/orders/' + orderId, function (update) {
            appendTimeline(update.status, update.message);
            renderOrders();
        });
    }

    client.connect(function () {
        if (trackedOrderId) { subscribeToOrder(trackedOrderId); }
        setInterval(renderOrders, 2000);
    });
    renderOrders();
</script>
</body>
</html>
