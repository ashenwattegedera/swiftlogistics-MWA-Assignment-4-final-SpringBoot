<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftTrack — Driver App</title>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f4f6f9; color: #1a2733; }
        header { background: #2e7d32; color: #fff; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        .wrap { max-width: 820px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 20px; margin-bottom: 20px; }
        .card h2 { margin: 0 0 16px; font-size: 16px; color: #2e7d32; }
        .toolbar { display: flex; gap: 12px; align-items: center; }
        input { padding: 8px; border: 1px solid #cdd5dd; border-radius: 4px; }
        button { border: 0; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; color: #fff; }
        .btn-start { background: #1b5e8f; }
        .btn-deliver { background: #2e7d32; }
        .btn-fail { background: #c62828; }
        .manifest-item { border: 1px solid #e8edf2; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
        .manifest-item .meta { font-size: 12px; color: #556; }
        .manifest-item .actions { margin-top: 8px; display: flex; gap: 8px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #cce5ff; color: #004085; }
        #notifications { list-style: none; padding: 0; font-size: 13px; }
        #notifications li { padding: 6px 0; border-bottom: 1px solid #eef; }
    </style>
</head>
<body>
<header><h1>SwiftTrack — Driver App (mock)</h1></header>
<div class="wrap">
    <div class="card">
        <div class="toolbar">
            <label>Driver ID</label>
            <input id="driverId" value="VH-01">
            <button class="btn-start" onclick="loadManifest()">Load manifest</button>
        </div>
        <h2>Today's manifest</h2>
        <div id="manifest">Press "Load manifest".</div>
    </div>
    <div class="card">
        <h2>Notifications (live)</h2>
        <ul id="notifications"></ul>
    </div>
</div>

<script src="stomp.js"></script>
<script>
    function driverId() { return document.getElementById('driverId').value; }

    function loadManifest() {
        fetch('/api/drivers/' + driverId() + '/manifest')
            .then(r => r.json())
            .then(renderManifest);
    }

    function renderManifest(orders) {
        var box = document.getElementById('manifest');
        if (!orders || orders.length === 0) { box.innerHTML = 'No deliveries assigned.'; return; }
        box.innerHTML = '';
        orders.forEach(function (o) {
            var div = document.createElement('div');
            div.className = 'manifest-item';
            div.innerHTML = '<div><span class="badge">' + o.status + '</span> <strong>' + o.orderId + '</strong></div>' +
                '<div class="meta">' + o.recipient.name + ' — ' + o.address.street + ', ' + o.address.city + '</div>' +
                '<div class="actions">' +
                '<button class="btn-start" onclick="action(\'' + o.orderId + '\',\'start\')">Start</button>' +
                '<button class="btn-deliver" onclick="action(\'' + o.orderId + '\',\'deliver\')">Delivered</button>' +
                '<button class="btn-fail" onclick="action(\'' + o.orderId + '\',\'fail\')">Failed</button>' +
                '</div>';
            box.appendChild(div);
        });
    }

    function action(orderId, type) {
        var path = '/api/deliveries/' + orderId + '/' + type;
        var opts = { method: 'POST' };
        if (type === 'fail') {
            opts.headers = { 'Content-Type': 'application/json' };
            opts.body = JSON.stringify({ reason: 'Recipient not available' });
        }
        fetch(path, opts).then(r => r.json()).then(function () { loadManifest(); });
    }

    var client = new StompClient('ws://' + location.host + '/ws');
    client.connect(function () {
        client.subscribe('/topic/drivers/' + driverId(), function (event) {
            var li = document.createElement('li');
            li.textContent = '[' + new Date().toLocaleTimeString() + '] ' + event.title + ' — ' + event.message;
            document.getElementById('notifications').appendChild(li);
        });
    });
    loadManifest();
</script>
</body>
</html>
